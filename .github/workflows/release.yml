name: Release

on:
  push:
    tags:
      # Fork releases only (v<upstream-base>-knh.<n>). A plain upstream-style tag
      # must never produce a release, or auto-update would offer upstream code.
      - 'v*-knh.*'

permissions:
  contents: read

env:
  GO_VERSION: '1.26'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true # always the newest 1.26.x patch (stdlib security fixes)
          cache: true

      - name: Run tests
        run: go test ./... -v -race

  build:
    name: Build
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true # always the newest 1.26.x patch (stdlib security fixes)
          cache: true

      - name: Set build variables
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          echo "ext=$EXT" >> "$GITHUB_OUTPUT"

      - name: Build Dashboard
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: >-
          go build -ldflags="-s -w
          -X github.com/CTJaeger/KleverNodeHub/internal/version.Version=${{ steps.vars.outputs.version }}
          -X github.com/CTJaeger/KleverNodeHub/internal/version.GitCommit=${{ steps.vars.outputs.commit }}
          -X github.com/CTJaeger/KleverNodeHub/internal/version.BuildTime=${{ steps.vars.outputs.build_time }}"
          -o bin/klever-node-hub-${{ matrix.goos }}-${{ matrix.goarch }}${{ steps.vars.outputs.ext }} ./cmd/dashboard

      - name: Build Agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: >-
          go build -ldflags="-s -w
          -X github.com/CTJaeger/KleverNodeHub/internal/version.Version=${{ steps.vars.outputs.version }}
          -X github.com/CTJaeger/KleverNodeHub/internal/version.GitCommit=${{ steps.vars.outputs.commit }}
          -X github.com/CTJaeger/KleverNodeHub/internal/version.BuildTime=${{ steps.vars.outputs.build_time }}"
          -o bin/klever-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ steps.vars.outputs.ext }} ./cmd/agent

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/

  docker:
    name: Docker images (GHCR)
    # After the release job: it runs in the protected environment (reviewer)
    # and fails without a valid signature, so no image ships without both.
    needs: [release]
    # Images for this repository only (upstream's Docker Hub images ended with
    # its archived repository). Pushed as ghcr.io/test0rmaik/<image>:<tag>
    # and :latest; Docker users pull new releases, the hub does not self-update.
    if: github.repository == 'Test0rMaik/KleverNodeHub'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_PREFIX: ghcr.io/test0rmaik
    steps:
      - uses: actions/checkout@v6

      - name: Set build variables
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ steps.vars.outputs.commit }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/klever-node-hub:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/klever-node-hub:latest

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.agent
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            GIT_COMMIT=${{ steps.vars.outputs.commit }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/klever-agent:${{ steps.vars.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/klever-agent:latest

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    # RELEASE_SIGNING_KEY lives in this protected environment (required
    # reviewer, v*-knh.* tags only), not as a repository secret.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          pattern: binaries-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        # The release line is signed with the checksums: agents refuse versions
        # older than their own, and hubs check it matches the tag they asked for.
        run: |
          sha256sum * > checksums.txt
          echo "# release ${GITHUB_REF_NAME}" >> checksums.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      # Hubs and agents only install binaries listed in a checksums.txt signed
      # with this key; without the secret the release must not be published.
      - name: Sign checksums
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: go run ./cmd/releasesign sign artifacts/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*
